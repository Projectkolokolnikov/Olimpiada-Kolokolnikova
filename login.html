<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Администратор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-page">
<div class="login-wrap">
    <div class="login-logo">
        <div class="login-logo-icon">К</div>
        <h1>Панель администратора</h1>
        <p>Олимпиада имени С.И. Колокольникова</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}
      <div class="admin-flash admin-flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}{% endif %}
    {% endwith %}
    <form method="POST" class="login-form">
        <div class="a-form-group">
            <label>Логин</label>
            <input type="text" name="login" placeholder="admin"
                   required autofocus>
        </div>
        <div class="a-form-group">
            <label>Пароль</label>
            <input type="password" name="password"
                   placeholder="••••••••" required>
        </div>
        <button type="submit" class="a-btn a-btn-primary"
                style="width:100%; justify-content:center">
            Войти
        </button>
    </form>
</div>
</body>
</html>
