{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">К</div>
                <h1>Регистрация</h1>
                <p>Олимпиада имени С.И. Колокольникова</p>
            </div>
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label>E-mail <span class="required">*</span></label>
                    <input type="email" name="email" placeholder="example@mail.ru"
                           required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Пароль <span class="required">*</span></label>
                    <input type="password" name="password"
                           placeholder="Не менее 6 символов" required>
                </div>
                <div class="form-group">
                    <label>Повторите пароль <span class="required">*</span></label>
                    <input type="password" name="password2"
                           placeholder="Повторите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary large"
                        style="width:100%; justify-content:center">
                    Зарегистрироваться
                </button>
            </form>
            <div class="auth-links">
                <span>Уже есть аккаунт?</span>
                <a href="/login">Войти</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
