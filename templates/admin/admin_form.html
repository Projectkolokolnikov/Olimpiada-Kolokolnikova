{% extends 'admin/base.html' %}
{% block title %}Добавить администратора{% endblock %}
{% block content %}

<div class="a-page-header">
    <h1>Добавить администратора</h1>
    <a href="/admin/admins" class="a-btn a-btn-outline">← Назад</a>
</div>

<div class="a-form-card">
    <form method="POST">
        <div class="a-form-group">
            <label>Имя <span class="req">*</span></label>
            <input type="text" name="name" placeholder="Иван Иванов" required>
        </div>
        <div class="a-form-group">
            <label>Логин <span class="req">*</span></label>
            <input type="text" name="login" placeholder="admin2" required>
        </div>
        <div class="a-form-group">
            <label>Пароль <span class="req">*</span></label>
            <input type="password" name="password"
                   placeholder="Не менее 6 символов" required>
        </div>
        <div class="a-form-actions">
            <button type="submit" class="a-btn a-btn-primary">Создать</button>
            <a href="/admin/admins" class="a-btn a-btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
