{% extends 'base.html' %}
{% block content %}

<section class="page-hero small">
    <div class="container">
        <a href="/news" class="back-link">← Все новости</a>
        <div class="page-hero-content">
            <div class="section-label">{{ item.date }}</div>
            <h1 class="page-title">{{ item.title }}</h1>
        </div>
    </div>
</section>

<section class="detail-section">
    <div class="container">
        <div class="detail-content animate-fade-up">
            <p>{{ item.text }}</p>
        </div>
        <a href="/news" class="btn btn-outline">← Вернуться к новостям</a>
    </div>
</section>
{% endblock %}
