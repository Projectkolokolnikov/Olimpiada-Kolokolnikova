{% extends 'admin/base.html' %}
{% block title %}Добавить результат{% endblock %}
{% block content %}

<div class="a-page-header">
    <h1>Добавить результат</h1>
    <a href="/admin/participants" class="a-btn a-btn-outline">← Назад</a>
</div>

<div class="a-form-card">
    <form method="POST" enctype="multipart/form-data">
        <div class="a-form-group">
            <label>Участник <span class="req">*</span></label>
            <select name="user_id" required>
                <option value="">Выберите участника...</option>
                {% for u in users %}
                <option value="{{ u.id }}"
                    {{ 'selected' if request.args.get('user_id')==u.id|string }}>
                    {{ u.profile.fio if u.profile and u.profile.fio else u.email }}
                    ({{ u.email }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="a-form-group">
            <label>Этап <span class="req">*</span></label>
            <select name="tour" required>
                <option value="">Выберите...</option>
                <option value="I этап — Отборочный (03 марта 2026)">
                    I этап — Отборочный
                </option>
                <option value="II этап — Заключительный (22–23 апреля 2026)">
                    II этап — Заключительный
                </option>
            </select>
        </div>
        <div class="a-form-grid">
            <div class="a-form-group">
                <label>Баллы участника <span class="req">*</span></label>
                <input type="number" name="score" min="0" placeholder="45" required>
            </div>
            <div class="a-form-group">
                <label>Максимум баллов <span class="req">*</span></label>
                <input type="number" name="max_score" min="1"
                       placeholder="100" required>
            </div>
            <div class="a-form-group">
                <label>Диплом / статус</label>
                <select name="diploma">
                    <option value="">Не указывать</option>
                    <option value="Победитель I степени">Победитель I степени</option>
                    <option value="Победитель II степени">Победитель II степени</option>
                    <option value="Победитель III степени">Победитель III степени</option>
                    <option value="Призёр I степени">Призёр I степени</option>
                    <option value="Призёр II степени">Призёр II степени</option>
                    <option value="Призёр III степени">Призёр III степени</option>
                    <option value="Участник">Участник</option>
                </select>
            </div>
        </div>
        <div class="a-form-group">
            <label>Комментарий</label>
            <textarea name="comment" rows="3"
                      placeholder="Например: допущен ко II этапу"></textarea>
        </div>
        <div class="a-form-group">
            <label>Скан работы (PDF, JPG, PNG)</label>
            <input type="file" name="scan" accept=".pdf,.jpg,.jpeg,.png">
            <small>Файл будет доступен участнику в личном кабинете</small>
        </div>
        <div class="a-form-actions">
            <button type="submit" class="a-btn a-btn-primary">
                Добавить результат
            </button>
            <a href="/admin/participants" class="a-btn a-btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
