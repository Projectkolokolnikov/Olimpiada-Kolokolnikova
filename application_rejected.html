<!DOCTYPE html>
<html>
<body style="font-family: Georgia, serif; background:#f5f0e8; padding:40px 0;">
<div style="max-width:560px; margin:0 auto; background:#fff;
            border:1px solid #ddd3bb; border-radius:4px; overflow:hidden;">
    <div style="background:#3d2b1a; padding:32px; text-align:center;">
        <h1 style="color:#e8d5b0; margin:0; font-size:20px;">
            Олимпиада имени С.И. Колокольникова
        </h1>
    </div>
    <div style="padding:32px;">
        <h2 style="color:#2d1f0e;">Информация по вашей заявке</h2>
        <p style="color:#4a3520; line-height:1.7;">
            Здравствуйте, <strong>{{ user.profile.fio or user.email }}</strong>!
        </p>
        <p style="color:#4a3520; line-height:1.7;">
            К сожалению, ваша заявка не была принята.
        </p>
        {% if reason %}
        <div style="background:#f8d7da; border-left:3px solid #dc3545;
                    padding:16px; margin:20px 0; border-radius:0 3px 3px 0;">
            <p style="color:#721c24; margin:0; font-size:13px;">
                <strong>Причина:</strong> {{ reason }}
            </p>
        </div>
        {% endif %}
        <p style="color:#4a3520; line-height:1.7;">
            Если у вас есть вопросы — напишите нам: olimpiada@example.com
        </p>
    </div>
</div>
</body>
</html>
